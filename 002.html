<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
</head>

<body>
    <!--
        <p></p> = tag para parágrafo
        <br> = quebra de linha (coloco onde quiser que tenha um ENTER)
    -->
    <p>Olá mundo!<br>
        <!--
            <em></em> = tag para dar ênfase no texto
            <strong></strong> = destaque de texto, um texto com strong significa que ele tem uma importância maior dentro daquele parágrafo
        -->
            <em>Guilherme Albuquerque</em></p>
            <p>Senac <strong>Americana</strong></p>
    </p>

    <hr>
    <!--
        ul - unordered list
        ol - ordered list
    -->
    <ul>
        <!--
            <li> - list item
        -->
        <li>HTML - HyperText Markup Language</li>
        <li>CSS - Cascading Style Sheet</li>
        <li>JS - JavaScript</li>
        <li>Outro item</li>
    </ul>

    <hr>
    <!--
        <img> - inserir imagem
            src - local da imagem
    -->
        <p style="background: red;">
            <img src="https://gutoffline.github.io/recursos/images/AULA_002/computador.jpg"><br>
            <img src="https://gutoffline.github.io/recursos/images/AULA_002/computador-transparente.png">
        </p>

        <p>
            O que eu aprendi aqui?<br>
            Aprendi a criar comentários, colocar imagens, criar listas, formatar com o CSS o fundo de um parágrafo.
        </p>
</body>

</html>
